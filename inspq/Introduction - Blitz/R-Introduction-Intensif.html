# Les bases

---

## Les commentaires
Le symbole pour les commentaires est le dièse (`#`).

``` r
# Ci-dessous est une addition :
4 + 3
```

```
#&gt; [1] 7
```

``` r
# La ligne de code ci-dessous ne sera pas évaluée
# 4 + 3
```

---

## Arithmétique

.pull-left[

``` r
# Addition
4 + 3
```

```
#&gt; [1] 7
```

``` r
# Multiplication
4 * 3
```

```
#&gt; [1] 12
```

``` r
# Exposant
4 ^ 3
```

```
#&gt; [1] 64
```
]

.pull-right[

``` r
# Soustraction
4 - 3
```

```
#&gt; [1] 1
```

``` r
# Division
4 / 3
```

```
#&gt; [1] 1.333333
```

``` r
# Modulo
4 %% 6
```

```
#&gt; [1] 4
```
]

---

## Utiliser des variables
Une variable permet de stocker une valeur ou un objet pour ensuite l'utiliser ultérieurement. On utilise la flèche `&lt;-` pour assigner à une variable une valeur. Le égal (`=`) fonctionne également, mais on priorisera ici la flèche.

``` r
x &lt;- 4
y &lt;- 3
```
On peut ensuite utiliser les variables pour faire des opérations

``` r
x + y  # 4 + 3
```

```
#&gt; [1] 7
```

``` r
z &lt;- x - y  # 1 = 4 - 3
z * y  # 1 * 3
```

```
#&gt; [1] 3
```

---

## Type de données

Nombres entiers : 4 (`integer`)

``` r
integer &lt;- 4
```
Exemple : année, age, code d'identification numérique.

Nombres décimaux : 4.5 (`numeric`)

``` r
numeric1 &lt;- 4.5
```
Exemples : taux, ratio

Nombres entiers en dehors de l'intervalle d'un entier standard seront aussi `numeric`&amp;nbsp;: ±2&amp;nbsp;147&amp;nbsp;483&amp;nbsp;647

``` r
numeric2 &lt;- 3e9  # équivalent à 3000000000
```
Exemple : identifiant des individus

---

## Type de données

Logique ou booléen : Vrai et Faux (`logical`)

``` r
logique1 &lt;- TRUE
logique2 &lt;- FALSE
```

Texte : Chaîne de caractères (`character`)  
Une chaîne de caractères se fait avec des guillemets simples&amp;nbsp;(`''`) ou doubles&amp;nbsp;(`""`). On doit utiliser une barre oblique inversée (`\`) lorsque le même guillemet est utilisé à l'intérieur de la chaîne de caractères (voir exemples 2 et 3).

``` r
character1 &lt;- "Il y a un atelier aujoud'hui"
character2 &lt;- 'Il y a un atelier aujourd\'hui'
character3 &lt;- "Voici des guillemets doubles : \" \""
character4 &lt;- 'Voici des guillemets doubles : " "'
```

# Vecteurs

---

## Qu'est-ce qu'un vecteur ?
Liste d'éléments qui partagent tous exactement **le même type de données**. Les vecteurs servent à stocker des données, même pour une seule valeur.

On crée un vecteur avec la fonction `c()` : *combine values into a vector*.

``` r
num_vec &lt;- c(1, 4.5, 10, NA)
chr_vec &lt;- c("a", "b", "c", NA)
logi_vec &lt;- c(TRUE, FALSE, FALSE, NA)
```
\* Les valeurs manquantes sont désignées par `NA`  que ce soit des nombres ou du texte.

---

## Opérations sur un vecteur
À partir du vecteur `qte`

``` r
qte &lt;- c(1, 3, 4, 5)
```


.pull-left[
L'arithmétique se fait sur chaque valeur.

``` r
qte + 4
```

```
#&gt; [1] 5 7 8 9
```

``` r
qte * 2
```

```
#&gt; [1]  2  6  8 10
```
]

.pull-right[
D'autres renvoient une seule valeur.

``` r
sum(qte)
```

```
#&gt; [1] 13
```

``` r
mean(qte)
```

```
#&gt; [1] 3.25
```
]

---

## Opérations sur un vecteur
À partir des vecteurs `qte1` et `qte2`

``` r
qte1 &lt;- c(1, 3, 4, 5)
qte2 &lt;- c(2, 1, 8, 4)
```
Les opérations se font selon la position des valeurs lorsque les vecteurs ont plusieurs valeurs et le **même nombre** de valeurs.

``` r
qte2 + qte1 # 2+1, 1+3, 8+4, 4+5
```

```
#&gt; [1]  3  4 12  9
```

``` r
qte2 * qte1 # 2*1, 1+3, 8*7, 4*5
```

```
#&gt; [1]  2  3 32 20
```

---

## Sélection d'une valeur dans un vecteur
Toujours à partir du vecteur `qte`

``` r
qte &lt;- c(1, 3, 4, 5)
```
On sélectionne une valeur en utilisant les crochets `[]`.

.pull-left[
Une seule valeur

``` r
qte[2]
```

```
#&gt; [1] 3
```

``` r
qte[3]
```

```
#&gt; [1] 4
```
]
.pull-right[
Plusieurs valeurs

``` r
qte[c(2, 4)]
```

```
#&gt; [1] 3 5
```

``` r
qte[c(2:4)]  # ou qte[2:4]
```

```
#&gt; [1] 3 4 5
```

``` r
qte[c(FALSE,TRUE,FALSE,TRUE)]
```

```
#&gt; [1] 3 5
```
]

---

## Comparaisons
Liste des opérateurs de comparaison :

- &lt; : plus petit que
- &lt;= : plus petit que ou égal à
- \&gt; : plus grand que
- \&gt;= : plus grand que ou égal à 
- == : égal à
- != : différent, n'est pas égal à

À partir des vecteur `qte1` et `qte2`

``` r
qte1 &lt;- c(1, 3, 4, 5)
qte2 &lt;- c(2, 1, 8, 4)
```
Est-ce que la valeur de `qte2` est plus petite que la valeur de `qte1`

``` r
qte2 &gt; qte1
```

```
#&gt; [1]  TRUE FALSE  TRUE FALSE
```

---

## Sélection et comparaison
.pull-left[
Puisqu'on pouvait sélectionner des valeurs avec `TRUE` et `FALSE`

``` r
qte2[c(FALSE,TRUE,FALSE,TRUE)]
```

```
#&gt; [1] 1 4
```
]
.pull-right[
Et qu'une comparaison retourne un vecteur `TRUE` et `FALSE`

``` r
qte2 &gt; qte1
```

```
#&gt; [1]  TRUE FALSE  TRUE FALSE
```
]

&lt;br&gt;&lt;br&gt;

On peut combiner les deux concepts
.pull-left[

``` r
qte2
```

```
#&gt; [1] 2 1 8 4
```
]
.pull-right[

``` r
qte1
```

```
#&gt; [1] 1 3 4 5
```
]

``` r
qte2[qte2 &gt; qte1]
```

```
#&gt; [1] 2 8
```
