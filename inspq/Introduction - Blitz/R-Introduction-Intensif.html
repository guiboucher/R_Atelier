# Les bases

---

## Les commentaires
Le symbole pour les commentaires est le dièse (`#`).

``` r
# Ci-dessous est une addition :
4 + 3
```

```
#&gt; [1] 7
```

``` r
# La ligne de code ci-dessous ne sera pas évaluée
# 4 + 3
```

---

## Arithmétique

.pull-left[

``` r
# Addition
4 + 3
```

```
#&gt; [1] 7
```

``` r
# Multiplication
4 * 3
```

```
#&gt; [1] 12
```

``` r
# Exposant
4 ^ 3
```

```
#&gt; [1] 64
```
]

.pull-right[

``` r
# Soustraction
4 - 3
```

```
#&gt; [1] 1
```

``` r
# Division
4 / 3
```

```
#&gt; [1] 1.333333
```

``` r
# Modulo
4 %% 6
```

```
#&gt; [1] 4
```
]

---

## Utiliser des variables
Une variable permet de stocker une valeur ou un objet pour ensuite l'utiliser ultérieurement. On utilise la flèche `&lt;-` pour assigner à une variable une valeur.

``` r
x &lt;- 4
y &lt;- 3
```
On peut ensuite utiliser les variables pour faire des opérations

``` r
x + y  # 4 + 3
```

```
#&gt; [1] 7
```

``` r
z &lt;- x - y  # 1 = 4 - 3
z * y  # 1 * 3
```

```
#&gt; [1] 3
```

---

## Type de données

Nombres entiers : 4 (`integer`)

``` r
integer &lt;- 4
```
Nombres décimaux : 4.5 (`numeric`)

``` r
numeric &lt;- 4.5
```
Nombres entiers en dehors de l'intervalle d'un entier standard (±2&amp;nbsp;147&amp;nbsp;483&amp;nbsp;647)

``` r
numeric &lt;- 3e9  # équivalent à 3000000000
```
Logique ou booléen : Vrai et Faux (`logical`)

``` r
logique1 &lt;- TRUE
logique2 &lt;- FALSE
```

slideshow._releaseMath = function(el) {
  var i, text, code, codes = el.getElementsByTagName('code');
  for (i = 0; i < codes.length;) {
    code = codes[i];
    if (code.parentNode.tagName !== 'PRE' && code.childElementCount === 0) {
      text = code.textContent;
      if (/^\\\((.|\s)+\\\)$/.test(text) || /^\\\[(.|\s)+\\\]$/.test(text) ||
          /^\$\$(.|\s)+\$\$$/.test(text) ||
          /^\\begin\{([^}]+)\}(.|\s)+\\end\{[^}]+\}$/.test(text)) {
        code.outerHTML = code.innerHTML;  // remove <code></code>
        continue;
      }
    }
    i++;
  }
};
