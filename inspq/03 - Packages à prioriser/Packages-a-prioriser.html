# Tidyverse

Les *packages* qui seront présentés font partie du [tidyverse](https://tidyverse.org/), un **ensemble de packages** R conçu pour la science des données.

Le *tidyverse* s'installe et se charge de la même manière qu'un *package* normal.

``` r
install.packages("tidyverse")  # installation
library(tidyverse)             # chargement
```
Puisque `library(tidyverse)` charge un ensemble de *packages*, on suggère d'appeler uniquement le ou les *packages* utilisés, surtout si vous avez des enjeux d'espaces mémoire.  
Exécuter `library(tidyverse)` est équivalent à

``` r
library(ggplot2)
library(dplyr)
library(tidyr)
library(readr)
library(purrr)
library(tibble)
library(stringr)
library(forcats)
library(lubridate)
```

## Concepts importants à connaître d'abord
Dans le tidyverse, il y a deux nouveaux concepts à connaître.

1) Les *pipes* (`%&gt;%`, `|&gt;`) insèrent automatiquement le résultat précédent comme premier argument de la fonction suivante.


``` r
mean(1:5)
```

```
#&gt; [1] 3
```

``` r
1:5 |&gt; mean()
```

```
#&gt; [1] 3
```

``` r
1:5 %&gt;% mean()
```

```
#&gt; [1] 3
```

&lt;div class="breadcrumb"&gt;

&lt;/div&gt;

## Concepts importants à connaître d'abord

2) L'évaluation des données (*data masking*)  
Permets d'utiliser des variables directement à l'intérieur d'une table. Il n'est plus nécessaire d'indiquer le nom de la table (`ma_table$ma_variable`).

Pour calculer l'IMC :

``` r
# Sans data masking (R de base)
ma_table$imc &lt;- ma_table$poids / ma_table$taille^2

# Avec data masking (tidyverse)
mutate(ma_table, imc = poids / taille^2)

# Avec data masking + pipes
ma_table %&gt;% mutate(imc = poids / taille^2)
```

## Quand utiliser dplyr ?

- Aussitôt que vous êtes dans un `data.frame`
  + Pour manipuler et transformer **le contenu** d'un tableau.
  + Lorsque les données ont la bonne forme, mais qu'on veut extraire des informations ou faire des calculs.
- Filtrer, sélectionner, créer des colonnes, grouper, calculer des moyennes, trier...

Les principales fonctions sont :
- `select()` pour la sélection des variables (colonnes);
- `filter()` pour la sélection des observations (lignes);
- `mutate()` pour l'ajout ou la modification de variables;
- `group_by()` pour effectuer une opération *par groupe*;
- `summarise()` pour des statistiques résumées;
- `arrange()` pour trier les données.

&lt;br&gt;
La page officielle est disponible [ici](https://dplyr.tidyverse.org/).

`dplyr` contient combien d'objets (fonctions, variables, tables...) ?


``` r
length(ls("package:dplyr"))
```

```
#&gt; [1] 288
```

### Objets masqués
L'ordre dans lequel les *packages* sont appelés a un impact sur quel objet est masqué par quoi. Il est préférable de charger les *packages* au début de son code pour éviter l'erreur ci-dessous :

``` r
x &lt;- 1:10
filter(x, rep(1, 3))  # par défaut stats::filter()
library(dplyr)
filter(x, rep(1, 6))  # maintenant par défaut dplyr::filter()
```
&gt; Erreur dans UseMethod("filter") :&lt;br&gt;
&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;pas de méthode pour 'filter' applicable pour un objet de classe&lt;br&gt;
&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;"c('integer', 'numeric')"

Le message d'erreur indique qu'on a essayé d'utiliser `filter()` sur un objet numérique alors que la fonction s'attend à recevoir un tableau.

Exemple avec la fonction `print()` :

``` r

```

Pour connaître toutes les méthodes d'une fonction :

``` r

```

```
#&gt;  [1] "print.acf"               "print.activeConcordance"

## select

On utilise `select(.data, ...)` pour choisir ou exclure certaines colonnes.

### Arguments

- **`.data`** : Un `data.frame` ou tout ce qui en découle. Voir `tibble`, `lazy data.frame`, `data.table`...
- **`...`** : Une ou plusieurs expressions séparées par des virgules.

## filter
On utilise `filter(.data, ...)` pour conserver les lignes et `filter_out(.data, ...)` pour les exclure.

Quelques exemples à utiliser dans `filter()` ou `filter_out()` :
.pull-left[

``` r
&lt;    # plus petit que
&gt;    # plus grand que
==   # égal à
%in% # égal à plusieurs valeurs

&amp;    # et
!    # contraire de

is.na()  # est valeur manquante
```
]
.pull-right[

``` r
&lt;=  # plus petit ou égal à
&gt;=  # plus grand ou égal à
!=  # n'est pas égal à

  
|   # ou


between(x, y, z)  # [y, z] de x
```
]

2) Exclure les RLS 1001, 1701 et 1801.&lt;br&gt;
3) Au moins un diagnostic (`dx1` a une valeur).

``` r
# Séparer par des virgules = ET / AND
cohort_rx_dx %&gt;% select(id, sexe, rls, code, duration, dx1) %&gt;%
  filter(duration == 30, !rls %in% c("1001", "1701", "1801"), !is.na(dx1))
```

#&gt; 2:     6      M   0516      U       30      A

  filter(duration == 30 &amp; !rls %in% c("1001", "1701", "1801") &amp; !is.na(dx1))
```

## group_by
On utilise `group_by(.data, ...)` pour faire une analyse pour chaque groupe.

Supposons qu'on voudrait calculer, au moment du service, le nombre de jours qu'un individu s'est fait prescrire un médicament au moment (somme cumulative)

Sans `group_by`

``` r
rx[c(1:3, 298:300), c("id", "duration")] %&gt;%
  mutate(cumulatif = cumsum(duration))
```

```
#&gt;       id duration cumulatif
#&gt;    &lt;int&gt;    &lt;num&gt;     &lt;num&gt;
#&gt; 1:     1        1         1
#&gt; 2:     1        1         2
#&gt; 3:     1       30        32
#&gt; 4:     2       45        77
#&gt; 5:     2       90       167
#&gt; 6:     2       60       227
```
Les 32 jours du `id 1` s'ajoute aux premiers 45 jours du `id 2`.

### ungroup

On utilise `ungroup` pour supprimer un `group_by` qui précède.

``` r
rx[c(1:3, 298:300)] %&gt;%
  select(id, start, duration) %&gt;%
  group_by(id) %&gt;%
  mutate(cumulatif = cumsum(duration),
         min_start_id = min(start)) %&gt;%  # date min par id
  ungroup() %&gt;%
  mutate(min_start_tout = min(start))  # date min pour tout
```

## pivot_longer
Il est préférable (pour ne pas dire obligé) de travailler avec des tables *en longueur* où chaque ligne est **une seule et unique observation**.

Exemple où on a plusieurs diagnostics sur la même ligne.

``` r
# Table des diagnostics avec les informations pertinentes
dx &lt;- cohort_rx_dx %&gt;%
  select(id, start, dx1, dx2, dx3) %&gt;%
  filter(!is.na(dx1))  # lignes sans diagnostics
```

```
#&gt;       id      start    dx1    dx2    dx3
#&gt;    &lt;int&gt;     &lt;Date&gt; &lt;char&gt; &lt;char&gt; &lt;char&gt;
#&gt; 1:     3 2000-01-24      I      F   &lt;NA&gt;
#&gt; 2:     3 2000-02-18      B      G   &lt;NA&gt;
#&gt; 3:     3 2000-03-14      I   &lt;NA&gt;   &lt;NA&gt;
#&gt; 4:     3 2000-05-07      C      I      B
#&gt; 5:     3 2000-05-25      D   &lt;NA&gt;   &lt;NA&gt;
#&gt; 6:     3 2000-08-15      E      B      F
```

---

&lt;div class="breadcrumb"&gt;
    &lt;span&gt;tidyr&lt;/span&gt;
    &lt;span&gt;pivot_longer&lt;/span&gt;
&lt;/div&gt;

Les colonnes `dx1`, `dx2` et `dx3` ne respectent pas le concept de *une ligne par observation*. On transforme la table pour que chaque colonne devienne une ligne.

``` r
dx_long &lt;- dx %&gt;%
  pivot_longer(
    cols = dx1:dx3,
    names_to = "ndx",
    values_to = "dx",
    values_drop_na = TRUE
  )
```

```
#&gt;   id      start ndx dx
#&gt; 1  3 2000-01-24 dx1  I
#&gt; 2  3 2000-01-24 dx2  F
#&gt; 3  3 2000-02-18 dx1  B
#&gt; 4  3 2000-02-18 dx2  G
#&gt; 5  3 2000-03-14 dx1  I
#&gt; 6  3 2000-05-07 dx1  C
```

R a été conçu pour manipuler des vecteurs. Comme les colonnes d'une table sont des vecteurs, R est généralement plus efficace lorsqu'on effectue une opération sur une colonne complète plutôt que lorsqu'on traite les données ligne par ligne.

Je veux que la colonne `ndx` soit un nombre entier allant de `1` à `N` au lieu de `dx1` à `dxN`.

``` r
dx_long &lt;- dx_long %&gt;%
  mutate(ndx = as.integer(str_remove(ndx, "dx")))
```

```
#&gt;   id      start ndx dx
#&gt; 1  3 2000-01-24   1  I
#&gt; 2  3 2000-01-24   2  F
#&gt; 3  3 2000-02-18   1  B
#&gt; 4  3 2000-02-18   2  G
```

## Quand utiliser lubridate ?
On peut utiliser `lubridate` aussitôt qu'on travaille avec une variable de type `Date`.

Le package lubridate simplifie le code en voulant exprimer le temps comme un concept plutôt qu’une chaîne de caractère formatée.


``` r
as.integer(format(as.Date("2020-06-01"), "%Y"))  # R de base
```

```
#&gt; [1] 2020
```

``` r
year(as_date("2020-06-01"))  # lubridate
```

```
#&gt; [1] 2020
```

La page officielle est disponible [ici](https://lubridate.tidyverse.org/).

`lubridate` contient combien d'objets (fonctions, variables, tables...) ?

``` r
library(lubridate)
length(ls("package:lubridate"))
```

```
#&gt; [1] 163
```

## Fonctions utiles

Créer une date

``` r
ymd("2025-06-15")
```

```
#&gt; [1] "2025-06-15"
```

``` r
dmy("15-06-2025")
```

```
#&gt; [1] "2025-06-15"
```

Extraire des composantes

``` r
year(ymd("2025-06-15"))
```

```
#&gt; [1] 2025
```

``` r
month(ymd("2025-06-15"))
```

```
#&gt; [1] 6
```

# readr

---
&lt;div class="breadcrumb"&gt;

&lt;/div&gt;

## Quand utiliser readr ?

Le *package* `readr` est la boîte à outils spécialisée pour lire les fichiers texte (`csv`, `txt`, `tsv`) dans R.

La page officielle est disponible [ici](https://readr.tidyverse.org/).

`readr` contient combien d'objets (fonctions, variables, tables...) ?

``` r
library(readr)
length(ls("package:readr"))
```

```
#&gt; [1] 103
```

Si on utilise les fonctions de base en R qui commencent par `read.` pour importer ou `write.` pour exporter, leur fonction équivalente en `readr` sont `read_` et `write_`.&lt;br&gt;
Par exemple `read.csv()` devient `read_csv()`.

---
class: code85
&lt;div class="breadcrumb"&gt;
    &lt;span&gt;readr&lt;/span&gt;

## Fonctions utiles

CSV

``` r
read_csv(); write_csv()  # séparateur "," et décimale "."
read_csv2(); write_csv2()  # séparateur ";" et décimale ","
```

TSV

``` r
read_tsv(); write_tsv()  # tsv = tab-separated values (\t)
```

Fichier général

``` r
read_delim(); write_delim()  # fonction générale où on décide
                             # le délimiteur et autres paramètres
```

## Autres *packages*

- `haven` pour du SPSS, Stata et SAS.
- `readxl` et `writexl` pour des fichiers Excel.&lt;br&gt;
Il y a d'autres solutions, mais essayer d'éviter ceux qui sont dépendants de Java.
- `data.table` avec `fread` et `fwrite`.
- [`fst`](https://www.fstpackage.org/) est un format dédié à R où on combine performance, compression et sélection des colonnes et des lignes.
