# Conditions

&lt;div class="breadcrumb"&gt;

&lt;/div&gt;

## Utilité des conditions
Une condition permet à R de prendre une décision selon qu'une règle est vraie (`TRUE`) ou fausse (`FALSE`).

Exemple :&lt;br&gt;
Si l'âge est de 65 ans ou plus,&lt;br&gt;
alors la personne est considéré comme un aîné.&lt;br&gt;
Sinon,&lt;br&gt;
elle n'est pas considéré comme un aîné.

``` r
age &lt;- 72
if (age &gt;= 65) {
  print("Aîné")
} else {
  print("Non aîné")
}
```

```
#&gt; [1] "Aîné"
```

---
&lt;div class="breadcrumb"&gt;
    &lt;span&gt;Conditions&lt;/span&gt;
    &lt;span&gt;Structure d'une condition&lt;/span&gt;
&lt;/div&gt;

## Structure d'une condition


``` r
if (condition) {
  
  action si TRUE
  
} else {
  
  action si FALSE
  
}
```

---
&lt;div class="breadcrumb"&gt;
    &lt;span&gt;Conditions&lt;/span&gt;
    &lt;span&gt;Plusieurs conditions&lt;/span&gt;
&lt;/div&gt;

## Plusieurs conditions
Lorsqu'il y a plusieurs conditions, la deuxième condition et les suivantes se font avec `else if`.

``` r
age &lt;- 45
if (age &gt;= 65) {
  print("Aîné")
} else if (age &gt;= 18) {
  print("Adulte")
} else if (age &lt; 18) {
  print("Mineur")
} else {
  print(NA)
}
```

```
#&gt; [1] "Adulte"
```

&lt;div class="breadcrumb"&gt;
    &lt;span&gt;Conditions&lt;/span&gt;
    &lt;span&gt;Conditions dans une condition&lt;/span&gt;

## Conditions dans une condition
Les conditions peuvent s'imbriquer les unes dans les autres

``` r
if (note &gt;= 60) {
  if (note &gt;= 90) {
    print("A")
  } else {
    print("Réussite")
  }
} else {
  if (note &gt;= 50) {
    print("Échec de peu")
  } else {
    print("Échec")
  }
}
```

## Condition sur un vecteur
`if` est utilisé pour prendre une décision dans un programme.&lt;br&gt;
On utilise `ifelse()` pour appliquer une règle à toutes les valeurs d'un vecteur ou d'une colonne.

``` r
age &lt;- c(72, 54, 22, 65, 18)
ifelse(test = age &gt;= 65, yes = "Aîné", no = "Adulte")
```

```
#&gt; [1] "Aîné"   "Adulte" "Adulte" "Aîné"   "Adulte"
```


``` r
age &lt;- c(72, 54, 22, 65, 7)
ifelse(
  age &gt;= 65,
  "Aîné",
  ifelse(age &gt; 18,
         "Adulte",
         "Mineur")
)
```

```
#&gt; [1] "Aîné"   "Adulte" "Adulte" "Aîné"   "Mineur"
```

## Utilité d'une fonction
Une fonction permet d'enregistrer une série d'instructions sous un nom afin de pouvoir les réutiliser.

``` r
groupe_age &lt;- function(age) {
  if (age &gt;= 65) {
    return("Aîné")
  } else {
    return("Non aîné")
  }
}
```

``` r
class(groupe_age)
```

```
#&gt; [1] "function"
```

## Structure d'une fonction

### Nom de la fonction
On commence par inscrire le nom de la fonction qu'on veut créer : `groupe_age`.

### Créer la fonction
On crée un objet fonction de la même manière qu'un `vector`, une `list`, un `data.frame`...

``` r
groupe_age &lt;- function() {...}
```

---
&lt;div class="breadcrumb"&gt;
    &lt;span&gt;Fonctions&lt;/span&gt;
    &lt;span&gt;Structure d'une fonction&lt;/span&gt;
&lt;/div&gt;

### Arguments
On inscrit les arguments à l'intérieur des parenthèses.

``` r
groupe_age &lt;- function(argument1, argument2)
```
Une fonction peut ne pas avoir d'argument.

``` r
msg_bienvenue &lt;- function() {
  paste("Aujourd'hui nous sommes le", Sys.Date())
}
msg_bienvenue()
```

```
#&gt; [1] "Aujourd'hui nous sommes le 2026-09-04"
```

---
&lt;div class="breadcrumb"&gt;
    &lt;span&gt;Fonctions&lt;/span&gt;
    &lt;span&gt;Structure d'une fonction&lt;/span&gt;
    &lt;span&gt;Arguments&lt;/span&gt;
&lt;/div&gt;

Prenons par exemple la fonction `median` :

``` r
args(median)
```

```
#&gt; function (x, na.rm = FALSE, ...) 
#&gt; NULL
```

- **`x`** : *an object for which a method has been defined, or a numeric vector containing the values whose median is to be computed*.
- **`na.rm = FALSE`** : *a logical value indicating whether NA values should be stripped before the computation proceeds*.
- **`...`** : *potentially further arguments for methods; not used in the default method*.

Le premier argument `x` n'a pas de valeur par défaut, il est donc **nécessaire** sinon il y aura une erreur.

``` r
median()
```

```
#&gt; Error in `median.default()`:
#&gt; ! l'argument "x" est manquant, avec aucune valeur par défaut
```

---
&lt;div class="breadcrumb"&gt;
    &lt;span&gt;Fonctions&lt;/span&gt;
    &lt;span&gt;Structure d'une fonction&lt;/span&gt;
    &lt;span&gt;Arguments&lt;/span&gt;
&lt;/div&gt;

L'argument `na.rm` a la valeur `FALSE` par défaut alors il n'est pas nécessaire de l'inclure si la valeur par défaut est celle qu'on veut utiliser.

``` r
median(x = 1:4)
```

```
#&gt; [1] 2.5
```

``` r
median(x = 1:4, na.rm = FALSE)
```

```
#&gt; [1] 2.5
```

Il n'est pas nécessaire de nommer les arguments lorsque l'ordre est respecté.

``` r
median(1:4, FALSE)
```

```
#&gt; [1] 2.5
```

Au contraire, il est nécessaire de nommer les arguments lorsque l'ordre n'est pas respecté.

``` r
median(na.rm = FALSE, x = 1:4)
```

```
#&gt; [1] 2.5
```

## Corps de la fonction
Exemple où on veut calculer l'indice de masse corporelle (IMC) :

``` r
poids &lt;- 80  # kg
taille &lt;- 1.75  # mètres
poids / taille ^ 2
```

```
#&gt; [1] 26.12245
```

Les variables `poids` et `taille` sont les arguments de la fonction

``` r
imc &lt;- function(poids, taille) {...}
```

et le calcul de la variable `imc_val` est le corps de la fonction, les instructions à exécuter.

``` r
imc &lt;- function(poids, taille) {
  poids / taille ^ 2
}
imc(poids = 80, taille = 1.75)
```

```
#&gt; [1] 26.12245
```

&lt;div class="breadcrumb"&gt;
    &lt;span&gt;Fonctions&lt;/span&gt;
    &lt;span&gt;Valeur retournée&lt;/span&gt;
&lt;/div&gt;

## Retour d'une fonction
R accepte deux styles pour retourner la valeur d'une fonction :

1. Retour implicite : la dernière ligne de code.

``` r
imc &lt;- function(poids, taille) {
  poids / taille ^ 2
}
```
2. Retour explicite : utiliser `return()`.

``` r
imc &lt;- function(poids, taille) {
  return(poids / taille ^ 2)
}

imc &lt;- function(poids, taille) {
  imc_val &lt;- poids / taille ^ 2
  return(imc_val)
}
```

# Boucles

---
&lt;div class="breadcrumb"&gt;

## Pourquoi utiliser une boucle
Une boucle permet de répéter un même bloc de code plusieurs fois de suite.

Analogie simple :

- Sans boucle, on dit : *Bonjour A*, *bonjour B*, *bonjour C*, ..., *bonjour Z*.
- Avec une boucle, on dit : *Pour chaque personne dans la liste, dire bonjour*.

---
class: code85

## For
S'utilise quand on sait exactement combien de fois on veut répéter l'action.
.pull-left[

``` r
for (i in 1:3) {
  print(i)
}
```

```
#&gt; [1] 1
#&gt; [1] 2
#&gt; [1] 3
```
]
.pull-right[

``` r
for (lettre in c("a","b","c")) {
  print(lettre)
}
```

```
#&gt; [1] "a"
#&gt; [1] "b"
#&gt; [1] "c"
```
]

Reviens à exécuter manuellement :
.pull-left[

``` r
i &lt;- 1
print(i)
i &lt;- 2
print(i)
i &lt;- 3
print(i)
```
]
.pull-right[

``` r
i &lt;- "a"
print(i)
i &lt;- "b"
print(i)
i &lt;- "c"
print(i)
```
]

    &lt;span&gt;While&lt;/span&gt;

## While
Utile quand on ne sait pas combien de tours il faut faire, mais on sait **quand** on doit arrêter.


``` r
while (x &lt;= 5) {
  print(x)    # 2, 3, 4, 5
  x &lt;- x + 1  # 3, 4, 5, 6 est plus grand que 5 -&gt; fin boucle
}
```

```
#&gt; [1] 2
#&gt; [1] 3
#&gt; [1] 4
#&gt; [1] 5
```

## lapply
C'est une fonction en R qui répète une même action sur chaque élément et renvoie le résultat sous la forme d'une liste.

``` r
args(lapply)
```

```
#&gt; function (X, FUN, ...) 
#&gt; NULL
```
- `X` : a vector (atomic or list) or an expression object. Other objects (including classed objects) will be coerced by base::as.list.
- `FUN` : the function to be applied to each element of X: see ‘Details’. In the case of functions like +, %*%, the function name must be backquoted or quoted.

---
&lt;div class="breadcrumb"&gt;
    &lt;span&gt;Boucles&lt;/span&gt;
    &lt;span&gt;lapply&lt;/span&gt;
&lt;/div&gt;

Exemple disponible dans la documentation :

``` r
x &lt;- list(a = 1:10, beta = exp(-3:3),
          logic = c(TRUE, FALSE, FALSE,TRUE))
lapply(x, mean)
```

```
#&gt; $a
#&gt; [1] 5.5
#&gt; 
#&gt; $beta
#&gt; [1] 4.535125
#&gt; 
#&gt; $logic
#&gt; [1] 0.5
```

---
&lt;div class="breadcrumb"&gt;
    &lt;span&gt;Boucles&lt;/span&gt;
    &lt;span&gt;lapply&lt;/span&gt;
&lt;/div&gt;

Exemple avec une fonction personnalisée :

``` r
# Prendre note que 1:5 est un vecteur comparativement à l'exemple
# précédent qui était une liste.
lapply(1:5, function(x) {
  x^2 + 4
})
```

```
#&gt; [[1]]
#&gt; [1] 5
#&gt; 
#&gt; [[2]]
#&gt; [1] 8
#&gt; 
#&gt; [[3]]
#&gt; [1] 13
#&gt; 
#&gt; [[4]]
#&gt; [1] 20
#&gt; 
#&gt; [[5]]
#&gt; [1] 29
```

---
&lt;div class="breadcrumb"&gt;
    &lt;span&gt;Boucles&lt;/span&gt;
    &lt;span&gt;lapply&lt;/span&gt;
&lt;/div&gt;

Exemple sur un `data.frame` :

``` r
lapply(iris[, 1:3], mean)
```

```
#&gt; $Sepal.Length
#&gt; [1] 5.843333
#&gt; 
#&gt; $Sepal.Width
#&gt; [1] 3.057333
#&gt; 
#&gt; $Petal.Length
#&gt; [1] 3.758
```

Comparativement à une boucle `for` :

``` r
for (col in names(iris[, 1:3])) {
  print(mean(iris[[col]]))
}
```

```
#&gt; [1] 5.843333
#&gt; [1] 3.057333
#&gt; [1] 3.758
```

## sapply
Le `l` dans `lapply` est pour `list` alors que le `s` dans `sapply` est pour `simplifié`

``` r
sapply(iris[, 1:3], mean)
```

```
#&gt; Sepal.Length  Sepal.Width Petal.Length 
#&gt;     5.843333     3.057333     3.758000
```

``` r
sapply(iris[, 1:3], mean, simplify = FALSE)  # Équivalent à lapply
```

```
#&gt; $Sepal.Length
#&gt; [1] 5.843333
#&gt; 
#&gt; $Sepal.Width
#&gt; [1] 3.057333
#&gt; 
#&gt; $Petal.Length
#&gt; [1] 3.758
```

  var i, text, code, codes = el.getElementsByTagName('code');
  for (i = 0; i < codes.length;) {
    code = codes[i];
    if (code.parentNode.tagName !== 'PRE' && code.childElementCount === 0) {
      text = code.textContent;
      if (/^\\\((.|\s)+\\\)$/.test(text) || /^\\\[(.|\s)+\\\]$/.test(text) ||
          /^\$\$(.|\s)+\$\$$/.test(text) ||
          /^\\begin\{([^}]+)\}(.|\s)+\\end\{[^}]+\}$/.test(text)) {
        code.outerHTML = code.innerHTML;  // remove <code></code>
        continue;
      }
    }
    i++;
  }
};
slideshow._releaseMath(document);
</script>
